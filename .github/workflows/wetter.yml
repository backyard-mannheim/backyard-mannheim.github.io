name: Wetter aktualisieren
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vorhersage holen
        run: |
          python3 - <<'PY'
          import json, urllib.request
          u=("https://api.open-meteo.com/v1/forecast?latitude=49.5167&longitude=8.4404"
             "&hourly=temperature_2m,weather_code,precipitation_probability,is_day"
             "&start_date=2026-10-17&end_date=2026-10-18&timezone=Europe%2FBerlin")
          d=json.load(urllib.request.urlopen(u,timeout=30))["hourly"]
          out={}
          for i,t in enumerate(d["time"]):
            if "2026-10-17T09:00"<=t<="2026-10-18T12:00":
              out[t]={"t":round(d["temperature_2m"][i],1),"c":d["weather_code"][i],
                      "p":d["precipitation_probability"][i] or 0,"day":d["is_day"][i]}
          if len(out)<10: raise SystemExit("zu wenig Daten")
          new=json.dumps(out,separators=(",",":"),sort_keys=True)
          try: old=open("wx.json").read()
          except FileNotFoundError: old=""
          if new!=old: open("wx.json","w").write(new)
          PY
      - name: Speichern
        run: |
          git config user.name "wetter-bot"; git config user.email "actions@users.noreply.github.com"
          git add wx.json
          git diff --cached --quiet || (git commit -m "Wetter aktualisiert" && git push)
