<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>BACKYARD – Mannheim | Chat</title>
<meta name="description" content="Live-Chat zum Backyard Ultra auf der Friesenheimer Insel">
<meta property="og:title" content="BACKYARD – Mannheim | Chat">
<meta property="og:description" content="Schreib mit – live während des Laufs">
<meta property="og:image" content="https://backyard-mannheim.github.io/titelbild4.png">
<meta name="theme-color" content="#1A1C1C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#1A1C1C;--grey2:#222525;--tile:#1C2E25;--border:#2E3833;--border2:#44524B;--text:#F2EFE6;--muted:#A9B8AE;--muted2:#7E9086;--accent:#FF7A2F;--on-accent:#0F1C16}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Barlow',system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh}
button,input,textarea{font:inherit;color:inherit}
header{background:var(--grey2);border-bottom:1px solid var(--border);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:12px}
.ttl{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.04em;display:flex;gap:8px;align-items:baseline;white-space:nowrap}
.ttl b{color:var(--accent);font-weight:700}.ttl span{color:var(--muted2)}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted2)}
.dot.on{background:var(--accent);animation:p 2s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(255,122,47,.55)}70%{box-shadow:0 0 0 7px rgba(255,122,47,0)}100%{box-shadow:0 0 0 0 rgba(255,122,47,0)}}
.btn{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:.06em;padding:7px 12px;border-radius:6px;border:1px solid var(--border2);background:var(--tile);color:var(--muted);cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[disabled]{opacity:.45;pointer-events:none}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;max-width:760px;width:100%;margin:0 auto}
.empty{margin:auto;text-align:center;color:var(--muted);padding:40px 10px}
.empty b{display:block;font-family:'Barlow Condensed',sans-serif;font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--text);margin-bottom:6px}
.day{align-self:center;font-size:12px;color:var(--muted2);font-family:'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;margin:6px 0}
.msg{max-width:82%;align-self:flex-end;--c:#A9B8AE;background:color-mix(in srgb,var(--c) 13%,#1A1C1C);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:14px 14px 4px 14px;padding:8px 12px 7px}
.msg.orga{align-self:flex-start;background:var(--tile);border-color:#2F5A43;border-radius:14px 14px 14px 4px}
.who{display:flex;gap:8px;align-items:baseline;font-size:12px;margin-bottom:2px}
.who b{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:.04em;color:var(--c)}
.msg.orga .who b{color:var(--text)}
.badge{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--on-accent);background:var(--accent);border-radius:4px;padding:1px 5px;align-self:center}
.orga-row{max-width:760px;margin:8px auto 0;display:flex;gap:8px;align-items:center;justify-content:flex-end;font-size:12px;color:var(--muted2)}
.orga-row button{background:none;border:none;color:var(--muted2);text-decoration:underline;cursor:pointer;font-size:12px}
.orga-row input{font-size:14px;padding:5px 8px;width:130px}
.orga-on{color:var(--accent)}
.who time{color:var(--muted2);font-variant-numeric:tabular-nums}
.txt{font-size:15px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
footer{border-top:1px solid var(--border);background:var(--grey2);padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.bar{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.name{flex:0 0 auto}
input,textarea{background:var(--bg);border:1px solid var(--border2);border-radius:8px;padding:9px 11px;outline:none;font-size:16px}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{flex:1;min-width:0;resize:none;max-height:120px;line-height:1.35}
.nm-row{max-width:760px;margin:0 auto 8px;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.nm-row input{flex:1;max-width:240px;font-size:15px;padding:6px 10px}
.nm-row button{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
.err{max-width:760px;margin:0 auto 6px;font-size:13px;color:#FF6B5B;min-height:0}
.err:empty{display:none}
@media(max-width:440px){#st{display:none}.ttl{font-size:18px}header{padding-left:12px;padding-right:12px}}
[hidden]{display:none!important}
.meta{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:3px;font-size:11px;color:var(--muted2)}
.msg.orga .meta{justify-content:flex-start}
.acts{display:inline-flex;gap:10px}
.acts button{background:none;border:none;color:var(--muted2);font-size:11px;cursor:pointer;text-decoration:underline;padding:0}
.acts button:hover{color:var(--text)}
.acts button.warn{color:#FF6B5B}
.ed{width:100%;min-width:220px;margin-top:4px;font-size:15px;background:var(--bg)}
.msg .acts{margin-top:4px}
</style>
</head>
<body>
<header>
  <div class="ttl"><b>BACKYARD</b><span>|</span>CHAT</div>
  <div style="display:flex;gap:10px;align-items:center">
    <span class="live"><span class="dot" id="dot"></span><span id="st">verbinde …</span></span>
    <a class="btn" href="https://claude.ai/artifact/AaJWDaipio1Q8hwTZDc2q6">← Live</a>
  </div>
</header>
<main id="list" aria-live="polite"><div class="empty"><b>Noch keine Nachrichten</b>Schreib die erste – feuer die Läufer an!</div></main>
<footer>
  <div class="err" id="err"></div>
  <div class="nm-row" id="nmRow"><input id="nm" maxlength="30" placeholder="Dein Name" aria-label="Dein Name" autocomplete="nickname"></div>
  <div class="bar">
    <textarea id="tx" rows="1" maxlength="500" placeholder="Nachricht schreiben …" aria-label="Nachricht"></textarea>
    <button class="btn primary" id="send">Senden</button>
  </div>
  <div class="orga-row" id="orgaRow"></div>
</footer>
<script>
const DB='https://backyard-mannheim-default-rtdb.europe-west1.firebasedatabase.app/chat';
const msgs={};let me='';
try{me=localStorage.getItem('by-name')||''}catch(e){}
const $=id=>document.getElementById(id),nm=$('nm'),tx=$('tx'),list=$('list');
nm.value=me;
nm.addEventListener('input',()=>{me=nm.value.trim();try{localStorage.setItem('by-name',me)}catch(e){};upd()});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PAL=['#F2A65A','#7FB3D5','#C39BD3','#F4D35E','#5FD3BC','#F1948A','#9AA5FF','#E59CC9','#B5D96B','#F7B267'];
let CM={};const col=n=>{const k=String(n).trim().toLowerCase();if(!(k in CM))CM[k]=Object.keys(CM).length;return PAL[CM[k]%PAL.length]};
const tm=t=>new Date(t).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
const dy=t=>new Date(t).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
let TOK='',MINE={};
try{TOK=localStorage.getItem('by-tok')||'';if(!TOK){TOK=Array.from(crypto.getRandomValues(new Uint8Array(18)),b=>b.toString(16).padStart(2,'0')).join('');localStorage.setItem('by-tok',TOK)}MINE=JSON.parse(localStorage.getItem('by-mine')||'{}')}catch(e){if(!TOK)TOK=Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)}
const ROOT=DB.replace(/\/chat$/,'');
const patch=b=>fetch(ROOT+'/.json',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
let editing=null,editVal='';
function render(){
  if(editing){const t=document.getElementById('edT');if(t)editVal=t.value}
  const arr=Object.entries(msgs).filter(([,m])=>m&&m.t).sort((a,b)=>a[1].t-b[1].t);
  const atBottom=list.scrollHeight-list.scrollTop-list.clientHeight<80;
  if(!arr.length){list.innerHTML='<div class="empty"><b>Noch keine Nachrichten</b>Schreib die erste – feuer die Läufer an!</div>';return}
  CM={};arr.forEach(([,m])=>{if(!m.o)col(m.n)});
  if(editing&&!msgs[editing])editing=null;
  let last='',h='';
  for(const [id,m] of arr){const d=dy(m.t);if(d!==last){h+=`<div class="day">${esc(d)}</div>`;last=d}
    const own=!!MINE[id],acts=[];
    if(own&&editing!==id)acts.push(`<button data-ed="${id}">bearbeiten</button>`);
    if(orga&&editing!==id)acts.push(`<button data-del="${id}">löschen</button>`);
    const body=editing===id
      ?`<textarea class="ed" id="edT" maxlength="500" rows="2">${esc(editVal)}</textarea><div class="acts"><button data-save="${id}">speichern</button><button data-cancel>abbrechen</button></div>`
      :`<div class="txt">${esc(m.m)}</div>${m.e||acts.length?`<div class="meta">${m.e?'<span>bearbeitet</span>':''}${acts.length?`<span class="acts">${acts.join('')}</span>`:''}</div>`:''}`;
    h+=m.o?`<div class="msg orga"><div class="who"><span class="badge">ORGA-TEAM</span><time>${tm(m.t)}</time></div>${body}</div>`
      :`<div class="msg" style="--c:${col(m.n)}"><div class="who"><b>${esc(m.n)}</b><time>${tm(m.t)}</time></div>${body}</div>`}
  list.innerHTML=h;if(atBottom||render.first!==false){list.scrollTop=list.scrollHeight;render.first=false}
  const t=document.getElementById('edT');if(t&&document.activeElement!==t&&render.focusEd){t.focus();t.setSelectionRange(t.value.length,t.value.length);render.focusEd=false}
}
list.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.ed){editing=b.dataset.ed;editVal=msgs[editing].m;render.focusEd=true;render();return}
  if(b.dataset.cancel!==undefined){editing=null;render();return}
  if(b.dataset.save){const id=b.dataset.save,v=(document.getElementById('edT').value||'').trim().slice(0,500);
    if(!v||v===msgs[id].m){editing=null;render();return}
    const r=await patch({['chat/'+id+'/m']:v,['chat/'+id+'/e']:{'.sv':'timestamp'},['etok/'+id]:TOK});
    if(r.ok){editing=null;render()}else $('err').textContent='Ändern hat nicht geklappt.';return}
  if(b.dataset.del){const id=b.dataset.del;
    if(b.dataset.sure!=='1'){b.dataset.sure='1';b.textContent='wirklich löschen?';b.classList.add('warn');setTimeout(()=>{if(b.isConnected){b.dataset.sure='';b.textContent='löschen';b.classList.remove('warn')}},4000);return}
    const r=await patch({['chat/'+id]:null,['dkeys/'+id]:orga});
    if(!r.ok){$('err').textContent='Löschen hat nicht geklappt – Orga-Code prüfen.'}}
});
function setSt(on,t){$('dot').classList.toggle('on',on);$('st').textContent=t}
let es;
function connect(){
  try{es&&es.close()}catch(e){}
  es=new EventSource(DB+'.json?orderBy=%22t%22&limitToLast=300');
  es.addEventListener('open',()=>setSt(true,'live'));
  const apply=(type,e)=>{const {path,data}=JSON.parse(e.data);
    if(path==='/'){if(type==='put')for(const k in msgs)delete msgs[k];if(data)Object.assign(msgs,data)}
    else{const k=path.split('/')[1];if(data===null)delete msgs[k];else if(type==='put'&&path.split('/').length===2)msgs[k]=data;else msgs[k]=Object.assign(msgs[k]||{},data)}
    render()};
  es.addEventListener('put',e=>apply('put',e));
  es.addEventListener('patch',e=>apply('patch',e));
  es.addEventListener('error',()=>setSt(false,'verbinde …'));
}
connect();
function upd(){$('send').disabled=!tx.value.trim();}
tx.addEventListener('input',()=>{tx.style.height='auto';tx.style.height=Math.min(tx.scrollHeight,120)+'px';upd()});
tx.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&window.matchMedia('(hover:hover)').matches){e.preventDefault();send()}});
$('send').addEventListener('click',send);
async function send(){
  const m=tx.value.trim();if(!m)return;
  if(!me&&!orga){$('err').textContent='Bitte zuerst deinen Namen eintragen.';nm.focus();return}
  $('err').textContent='';$('send').disabled=true;
  try{
    const msg={n:orga?'Orga-Team':me.slice(0,30),m:m.slice(0,500),t:{'.sv':'timestamp'}};
    const id=Date.now().toString(36)+Math.random().toString(36).slice(2,10);
    const up={['chat/'+id]:msg,['ekeys/'+id]:TOK};
    if(orga){msg.o=true;up['okeys/'+id]=orga}
    MINE[id]=1;try{localStorage.setItem('by-mine',JSON.stringify(MINE))}catch(e){}
    const r=await patch(up);
    if(!r.ok){delete MINE[id];try{localStorage.setItem('by-mine',JSON.stringify(MINE))}catch(e){}}
    if(r.status===401&&orga){orga='';try{localStorage.removeItem('by-orga')}catch(e){};orgaUI();throw new Error('code')}
    if(!r.ok)throw new Error(r.status);
    tx.value='';tx.style.height='auto';list.scrollTop=list.scrollHeight;
  }catch(e){$('err').textContent=e.message==='code'?'Orga-Code stimmt nicht – Nachricht nicht gesendet.':'Senden hat nicht geklappt – bitte nochmal versuchen.'}
  upd();
}
let orga='';try{orga=localStorage.getItem('by-orga')||''}catch(e){}
function orgaUI(){
  const r=$('orgaRow');
  $('nmRow').hidden=!!orga;
  render();
  r.innerHTML=orga?`<span class="orga-on">Du schreibst als Orga</span><button id="oOut">abmelden</button>`:`<button id="oIn">Orga-Login</button>`;
  if(orga)$('oOut').onclick=()=>{orga='';try{localStorage.removeItem('by-orga')}catch(e){};orgaUI()};
  else $('oIn').onclick=()=>{r.innerHTML=`<input id="oCode" placeholder="Orga-Code" autocomplete="off"><button id="oOk">OK</button><button id="oNo">abbrechen</button>`;
    $('oCode').focus();const ok=()=>{const v=$('oCode').value.trim().toUpperCase();if(v){orga=v;try{localStorage.setItem('by-orga',v)}catch(e){}}orgaUI()};
    $('oOk').onclick=ok;$('oCode').onkeydown=e=>{if(e.key==='Enter')ok()};$('oNo').onclick=orgaUI};
}
orgaUI();
upd();
</script>
</body>
</html>
